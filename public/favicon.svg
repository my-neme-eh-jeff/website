<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="A">
  <style>
    /*
     * Styled with plain CSS rules rather than custom properties: `var()` in an
     * SVG presentation attribute has a patchy history in WebKit, and a dropped
     * `stroke` would fall back to `none` — a blank tile with no letter, which is
     * worse than the scaffold icon this replaced.
     *
     * The swap matters because a #16150f tile disappears into a dark tab strip.
     * Chrome and Firefox honour prefers-color-scheme in a favicon; favicon.ico
     * covers whatever does not.
     */
    .tile { fill: #16150f }
    .mark { stroke: #fbfaf8 }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #f2f0e9 }
      .mark { stroke: #16150f }
    }
  </style>
  <rect class="tile" width="32" height="32" rx="7"/>
  <g class="mark" fill="none" stroke-width="3.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7.4 26 L16 6.4 L24.6 26"/>
    <path d="M11.44 18.4 H20.56"/>
  </g>
</svg>

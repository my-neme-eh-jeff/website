# Gate only: Cloudflare Workers Builds deploys `main`, so this repo's secrets
# hold no Cloudflare token and nothing here can publish.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Before setup-node, whose `cache: pnpm` needs the pnpm binary to find
      # the store.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.12.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm

      # No `--ignore-scripts`: pnpm 10 blocks dependency install scripts by
      # default, and `pnpm.onlyBuiltDependencies` in package.json approves none.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm run fmt.check

      - name: Lint
        run: pnpm run lint

      - name: Types
        run: pnpm run build.types

      - name: Build
        run: pnpm run build

      - name: Verify build invariants
        run: node scripts/verify-build.mjs

      # `--local`: gate this build, not whatever is deployed.
      - name: Lighthouse budget
        run: node scripts/audit.mjs --check --local

# Gate only. Deploys stay with Cloudflare Workers Builds, which watches `main`
# directly -- so there is no Cloudflare API token in this repo's secrets and
# nothing here can publish. See README "Deploys".
#
# The last step is the interesting one: scripts/verify-build.mjs asserts the
# invariants written down in CLAUDE.md against the real build output, so a
# regression fails here rather than silently in production.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only ever reads the repo.
permissions:
  contents: read

# A newer push makes an in-flight run irrelevant. Cancel it rather than paying
# for both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # 24 is Active LTS and satisfies the `>=21` branch of package.json
          # engines. Pinned to a major so a Node patch cannot change the build.
          node-version: "24"
          cache: npm

      # `ci` not `install`: installs exactly the lockfile and fails if
      # package.json and package-lock.json disagree. On a repo that pins every
      # dependency exactly, that disagreement is the bug worth catching.
      - name: Install
        run: npm ci

      # Ordered cheapest-first so an obvious failure reports in seconds rather
      # than after a full SSG pass.
      - name: Format check
        run: npm run fmt.check

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run build.types

      - name: Build
        run: npm run build

      - name: Verify build invariants
        run: node scripts/verify-build.mjs

      # Performance budget. Runs the same Lighthouse engine PSI uses, against
      # the built output, and fails if any category drops below its floor. It
      # WRITES NOTHING -- src/content/audit.json is refreshed deliberately with
      # `npm run audit`, because a CI job that commits would trigger itself.
      #
      # ubuntu-latest ships google-chrome-stable, which chrome-launcher finds.
      - name: Lighthouse budget
        run: node scripts/audit.mjs --check --local
